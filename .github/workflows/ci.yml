name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-eval:
    runs-on: ubuntu-latest
    env:
      FAKE_LLM: "true"
      API_KEY: ci-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check app tests scripts

      - name: Unit + integration tests
        run: uv run pytest -q

      - name: Offline eval suite (proves the full pipeline runs keyless)
        run: uv run python scripts/run_evals.py --fake

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agentic-research-platform:ci .
